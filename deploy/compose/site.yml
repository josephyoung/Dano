services:
  dano-site:
    image: ${DANO_SITE_IMAGE:-dano-site:local}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/web/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
