server_name _;
client_max_body_size 50m;

# The skillmanner admin UI is optional. Resolve it at request time so nginx can
# start even when the external skillmanner network has no web service attached.
location /admin {
  resolver 127.0.0.11 valid=10s;
  set $skillmanner_web http://skillmanner-web;
  proxy_pass $skillmanner_web;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;
}

# Keep the OAuth provider behind one Dano-owned namespace. The provider owns the
# /admin-api/ path, while sub_filter keeps root-relative resources inside that
# namespace in the browser.
location ^~ /admin-api/ {
  resolver 127.0.0.11 valid=10s ipv6=off;
  proxy_pass $dano_oauth_relay_origin;
  proxy_http_version 1.1;
  proxy_set_header Host $proxy_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Accept-Encoding "";
  proxy_ssl_server_name on;
  sub_filter_once off;
  sub_filter_types text/css application/javascript application/json;
  sub_filter '/assets/' '/admin-api/assets/';
  sub_filter '"/logo' '"/admin-api/logo';
  sub_filter "'/logo" "'/admin-api/logo";
  sub_filter '(/logo' '(/admin-api/logo';
  sub_filter '`/logo' '`/admin-api/logo';
  sub_filter '=/logo' '=/admin-api/logo';
  sub_filter '"/favicon' '"/admin-api/favicon';
  sub_filter "'/favicon" "'/admin-api/favicon";
  sub_filter '(/favicon' '(/admin-api/favicon';
  sub_filter '`/favicon' '`/admin-api/favicon';
  sub_filter '=/favicon' '=/admin-api/favicon';
}

location ~ ^/api/clients/[^/]+/events$ {
  proxy_pass http://dano_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  add_header X-Accel-Buffering no;
}

# OAuth callback query parameters contain one-time credentials. Match that
# endpoint exactly and disable both request-log channels so authorization codes
# and state cannot appear in deployment logs, including upstream failures.
location = /api/auth/callback {
  access_log off;
  error_log /dev/null;
  proxy_pass http://dano_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Origin $http_origin;
  proxy_no_cache 1;
  proxy_cache_bypass 1;
}

# Forward the browser Cookie and Origin for the remaining auth endpoints and
# keep auth request metadata out of production logs.
location ^~ /api/auth/ {
  access_log off;
  error_log /dev/null;
  proxy_pass http://dano_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Origin $http_origin;
  proxy_no_cache 1;
  proxy_cache_bypass 1;
}

location /api/ {
  proxy_pass http://dano_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /web {
  return 308 /web/;
}

# The product site is an independently released sidecar. Resolve it per
# request so Dano and nginx can start while the optional site is absent.
location ^~ /web/assets/ {
  resolver 127.0.0.11 valid=10s;
  set $dano_site http://dano-site:8080;
  rewrite ^/web(/.*)$ $1 break;
  proxy_pass $dano_site;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /web/ {
  resolver 127.0.0.11 valid=10s;
  set $dano_site http://dano-site:8080;
  proxy_pass $dano_site;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
  proxy_pass http://dano_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
